server {
    listen 80;
    server_name haidangmap.me;

    # Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (Optional: Keep it commented until SSL is working)
    location / {
        return 301 https://$host$request_uri;
    }

    # Temp proxy for apps (while getting certificates)
#     location /api/ {
#         proxy_pass http://backend:4000/api/;
#     }

#     location / {
#         proxy_pass http://frontend:3000;
#     }
}

server {
    listen 443 ssl;
    server_name haidangmap.me;

    ssl_certificate /etc/letsencrypt/live/haidangmap.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haidangmap.me/privkey.pem;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Next.js Proxy
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
